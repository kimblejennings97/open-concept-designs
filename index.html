<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Concept Designs</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <span class="brand">Open Concept Designs</span>
        <input id="design-name" class="name-input" type="text" maxlength="80" aria-label="Design name" spellcheck="false" />
        <span id="save-state" class="save-state"></span>
        <span class="spacer"></span>
        <button id="btn-career" type="button" class="primary">Career</button>
        <button id="btn-3d" type="button" title="See the design in 3D">3D</button>
        <button id="btn-sound" type="button" title="Sound on/off" aria-label="Sound">🔊</button>
        <button id="btn-new" type="button">New</button>
        <button id="btn-open" type="button">Open…</button>
      </header>

      <div class="workspace">
        <aside class="sidebar" id="sidebar">
          <section class="tools-section">
            <h2>Tools</h2>
            <div id="tools" class="tool-list"></div>
            <div class="quick">
              <button id="btn-undo" type="button" title="Undo (Ctrl+Z)">Undo</button>
              <button id="btn-redo" type="button" title="Redo (Ctrl+Y)">Redo</button>
              <button id="btn-remove" type="button" aria-pressed="false" title="The current tool removes instead of adds (same as right-drag)">Remove</button>
              <button id="btn-panel" type="button" class="mobile-only" aria-expanded="true">Panel</button>
            </div>
          </section>
          <section id="options" class="options"></section>
          <section class="brief-section" id="brief-section" hidden>
            <h2>Client brief</h2>
            <div id="brief"></div>
          </section>
          <section class="sim-section">
            <h2>Simulate</h2>
            <div id="sim"></div>
          </section>
          <section>
            <h2>Edit</h2>
            <div class="action-grid">
              <button id="btn-enclose" type="button" class="wide" title="Add walls around the whole footprint">Wall the footprint</button>
              <button id="btn-fit" type="button" class="wide" title="Fit lot to screen (Home)">Fit view</button>
              <button id="btn-export" type="button" title="Download this design as a file">Export</button>
              <button id="btn-import" type="button" title="Open a design file">Import</button>
              <button id="btn-share" type="button" class="wide" title="Copy a link that opens a copy of this design">Share link</button>
              <button id="btn-tips" type="button" class="wide" aria-pressed="true">Tips</button>
              <input id="file-import" type="file" accept=".json,application/json" hidden />
            </div>
          </section>
          <section class="stats">
            <h2>Cost</h2>
            <dl id="cost" class="cost"></dl>
          </section>
          <section class="stats">
            <h2>Building</h2>
            <dl id="stats"></dl>
          </section>
        </aside>

        <main class="canvas-wrap">
          <canvas id="blueprint"></canvas>
          <div id="coach" class="coach" hidden>
            <span id="coach-text"></span>
            <button id="btn-coach-hide" type="button" aria-label="Hide tips">✕</button>
          </div>
          <div id="view3d" class="view3d" hidden>
            <div class="view3d-bar">
              <button id="btn-3d-close" type="button">◀ Blueprint</button>
              <button id="btn-3d-walls" type="button" aria-pressed="true">Walls down</button>
              <button id="btn-3d-roof" type="button" aria-pressed="false">Roof</button>
              <button id="btn-3d-play" type="button">Run people</button>
              <span class="view3d-hint">Drag to orbit · scroll or pinch to zoom · right-drag or two fingers to pan</span>
            </div>
            <div id="view3d-status" class="view3d-status"></div>
          </div>
        </main>
      </div>

      <footer class="statusbar">
        <span id="status-hint"></span>
        <span class="spacer"></span>
        <span id="status-pos"></span>
      </footer>
    </div>

    <dialog id="dlg-new">
      <form method="dialog" id="form-new">
        <h2>New free-build design</h2>
        <p class="muted small">Everything unlocked, no client. For paid jobs, use Career.</p>
        <label>Start from
          <select name="start">
            <option value="blank">Empty lot</option>
            <option value="house">Sample: two-bedroom house</option>
            <option value="store">Sample: corner store</option>
            <optgroup label="Practice a client brief" id="brief-options"></optgroup>
          </select>
        </label>
        <label>Name <input name="name" type="text" value="Untitled design" maxlength="80" required /></label>
        <div class="row">
          <label>Lot width (m) <input name="w" type="number" min="5" max="100" step="0.5" value="20" required /></label>
          <label>Lot depth (m) <input name="h" type="number" min="5" max="100" step="0.5" value="15" required /></label>
        </div>
        <div class="dialog-actions">
          <button value="cancel" formnovalidate type="submit">Cancel</button>
          <button value="ok" type="submit" class="primary">Create</button>
        </div>
      </form>
    </dialog>

    <dialog id="dlg-career" class="office">
      <div id="career"></div>
    </dialog>

    <dialog id="dlg-report" class="report">
      <div id="report"></div>
    </dialog>

    <dialog id="dlg-open">
      <h2>Your designs</h2>
      <ul id="design-list" class="design-list"></ul>
      <div class="dialog-actions">
        <button id="btn-open-close" type="button">Close</button>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
